site_name: Ayuda de SIHSALUS
site_description: Guías de uso, tutoriales y novedades de SIHSALUS
site_author: SIHSALUS
copyright: SIHSALUS · Documentación de apoyo para usuarios
strict: true
use_directory_urls: true

theme:
  name: material
  language: es
  font: false
  palette:
    primary: teal
    accent: teal
  features:
    - navigation.indexes
    - navigation.sections
    - navigation.top
    - search.highlight
    - search.suggest

plugins:
  - search:
      lang: es

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - toc:
      permalink: true

extra_css:
  - assets/stylesheets/extra.css

extra:
  generator: false

validation:
  nav:
    omitted_files: warn
    not_found: warn
  links:
    not_found: warn
    anchors: warn
    unrecognized_links: warn

nav:
  - Inicio: index.md
  - Guías:
      - Todas las guías: guias/index.md
      - Identificación y registro: guias/identificacion-registro.md
      - Citas y llegada: guias/citas-llegada.md
      - Triaje y colas: guias/triaje-colas.md
      - Consulta externa: guias/consulta-externa.md
      - Farmacia: guias/farmacia.md
      - Laboratorio: guias/laboratorio.md
  - Tutoriales: tutoriales.md
  - Novedades: novedades.md
  - Ayuda y soporte: soporte.md
  - Privacidad y uso seguro: privacidad.md
