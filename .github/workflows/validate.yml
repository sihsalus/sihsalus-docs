name: Validate documentation

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build documentation
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install documentation dependencies
        run: python -m pip install --requirement requirements.txt

      - name: Build documentation
        run: mkdocs build --strict

      - name: Build static portal image
        run: docker build --tag sihsalus-docs:pr .

      - name: Smoke test static portal image
        run: |
          container_id="$(docker run --detach --publish 127.0.0.1:18080:8080 sihsalus-docs:pr)"
          trap 'docker rm --force "${container_id}" >/dev/null 2>&1 || true' EXIT
          curl --fail --retry 10 --retry-all-errors --retry-delay 1 http://127.0.0.1:18080/health
          curl --fail http://127.0.0.1:18080/
          curl --fail http://127.0.0.1:18080/guias/consulta-externa/
